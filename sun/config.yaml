# Dataset Paths
dataset:
  sun_test_annotations_path: "data/sun397_test.json"
  sun_train_annotations_path: "data/sun397_train.json"

  fgvc_images_dir: "SUN397/"

  images_per_class: 100
  images_per_class_debug: 5


# Model Configuration
models:
  gemma:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  gemma-alt:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8001/v1"
    api_key: "skip"

  gemmaa:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8002/v1"
    api_key: "skip"

  qwen:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8004/v1"
    api_key: "skip"

  qwen-alt:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  qwenn:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8002/v1"
    api_key: "skip"

  phi:
    full_name: "microsoft/Phi-3.5-vision-instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  llama:
    full_name: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    api_base: "http://localhost:8003/v1"
    api_key: "skip"


# Inference Settings
inference:
  temperature: 0.2
  max_tokens_instruction: 150
  max_tokens_inference: 150


# Experiment Settings
experiment:
  top_k_retrieval: [1, 2, 3, 5]
  max_workers: 100
  clip_model: "ViT-B-32"


# Output Paths
output:
  embeddings_path: "data/clip_embeddings_train.npy"
  test_embeddings_path: "data/clip_embeddings_test.npy"
  instruction_base_dir: "instruction/"
  image_base_dir: "image/"
  results_dir: "results/"
  figures_dir: "results/figures/"
  hybrid_dir: "hybrid/"
  hybrid_new_dir: "hybrid_new/"


# Prompts
prompts:

  instruction_generation: |
    You are an expert in scene understanding and fine-grained scene recognition. Your task is to generate generalizable identification rules for a scene category from the SUN397 dataset that can be applied to ANY image of this scene class — not just the example shown.

    Scene Category: {label}

    Generate exactly 3 identification rules in the following format:
    1. To identify [scene category], look for [primary scene-level cues — indoor vs outdoor, overall spatial envelope (open/expansive vs enclosed, natural vs man-made, rough/rugged vs smooth), dominant surfaces and materials (wood, tile, concrete, stone, foliage, sand, water, snow, glass, metal), characteristic lighting (natural sunlight vs artificial/electric), and the canonical layout or vantage point typical of this scene]
    2. To distinguish from visually similar scenes, focus on [the most reliable fine-grained cue — characteristic objects or fixtures that anchor the scene's function (e.g., operating table vs exam table, pews vs lecture seats, industrial machinery vs retail shelving), structural features (ceiling type, flooring pattern, wall treatment, signage, windows), depth and scale cues, or surface properties (wet, rusty, shiny, cluttered, sterile) that indicate the space's specific use]
    3. To avoid misclassification, check [the most commonly confused SUN397 categories — typically those sharing spatial layout, functional purpose, or dominant materials — and identify the single object, structural element, or spatial attribute that definitively resolves the ambiguity]

    Rules must be:
    - General enough to apply to any image of {label}, regardless of vantage point, time of day, season, or occupancy level
    - Focused on stable scene-level cues: spatial layout, dominant objects and fixtures, materials, surface properties, and functional purpose. Do not rely on transient elements (specific people, vehicles, weather conditions) or a single incidental object
    - Concise — one sentence each

    Do not write paragraphs. Do not describe this specific image. Do not ask questions.

  zero_shot: |
    Identify the scene category shown in the image.
    Provide only the scene category name from the SUN397 dataset, exactly as it appears in the dataset labels (e.g., abbey, airport_terminal, bamboo_forest, backseat car_interior). Do not output anything else.

  few_shot_system: |
    You are an expert scene recognition system trained on the visual properties of diverse scene categories from the SUN397 dataset. Study the following example images carefully, paying attention to spatial layout, indoor/outdoor setting, dominant objects and fixtures, materials, surface properties, and the functional purpose of each scene.

  few_shot_example: |
    Example {idx}:
    Scene: {label}

  few_shot_target: |
    Now classify the scene category in the following image.
    Provide only the scene category name from the SUN397 dataset, exactly as it appears in the dataset labels. Do not output anything else.

  approach1_system: |
    You are an expert scene classifier. Below are reasoning instructions derived from SUN397 images that are visually similar to the target image. Go through them carefully in order to classify the target image.

  approach1_example: |
    Instruction {idx}:
    Scene: {label}
    Instruction: {instruction}

  approach1_target: |
    Apply the above reasoning strategies to classify the following image into a SUN397 scene category. Focus on stable scene-level cues — indoor vs outdoor, spatial envelope (open/enclosed, natural/man-made, expansive/cluttered), dominant surfaces and materials, characteristic objects and fixtures that indicate function, structural features (ceiling type, flooring, wall treatment, signage, lighting), depth and scale cues, and surface properties (wet, rusty, sterile, shiny) — and relate them to the instructions provided. Do not be misled by transient elements such as people, vehicles, or weather conditions.
    Provide only the scene category name, exactly as mentioned in the instructions provided.

  hybrid_system: |
    You are an expert in fine-grained scene classification. You will be given two types of in-context examples:
    1. Visual examples: images paired with their correct SUN397 scene category name.
    2. Reasoning instructions: text-based strategies derived from visually similar SUN397 images, describing how to identify the scene category.
    Your goal is to correctly identify the scene category of the target image. Study all examples and instructions carefully before answering.

  hybrid_image_example: |
    Example {idx}:
    Scene: {label}

  hybrid_instruction_example: |
    Instruction Example {idx}:
    Scene: {label}
    Instruction: {instruction}

  hybrid_target: |
    Now predict the scene category name using both the visual examples and reasoning strategies above. Compare scene-level cues — indoor/outdoor setting, spatial layout, dominant objects and fixtures, materials, surface properties, and functional purpose — across the target and the examples. Do not be misled by transient elements (people, vehicles, weather) or a single incidental object. Use the visual examples and the instructions to answer based on the target image only. Do not get confused with the example images.
    Provide only the scene category name, exactly as it appears in the SUN397 dataset labels. Do not give a generic description.

  hybrid_new_system: |
    You are an expert in fine-grained scene classification. You will be given two types of in-context examples:
    1. Reasoning instructions: text-based strategies derived from visually similar images from the SUN397 dataset, describing how to identify the scene category.
    2. Visual examples: images paired with their correct scene category name.
    Your primary guidance comes from the reasoning instructions. Use the visual examples as supplementary evidence. Study all instructions and examples carefully before answering.

  hybrid_new_image_example: |
    Visual Example {idx}:
    Scene: {label}

  hybrid_new_instruction_example: |
    Reasoning Instruction {idx}:
    Scene: {label}
    Instruction: {instruction}

  hybrid_new_target: |
    Now predict the scene category name using the reasoning instructions and visual examples above. Use the exact SUN397 category names as shown in the example labels — do not paraphrase or describe. Apply the reasoning strategies first — checking indoor vs outdoor, spatial envelope (open/enclosed, natural/man-made), dominant objects and fixtures, materials, surface properties, and functional purpose — then use the visual examples to confirm. Do not be misled by transient elements (people, vehicles, weather) or a single incidental object. Do not get confused with the example images.
    Provide only the scene category name. Do not give a generic description.