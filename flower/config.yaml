# Dataset Paths
dataset:
  flower_test_annotations_path: "data/test.json"
  flower_train_annotations_path: "data/train.json"

  fgvc_images_dir: "102flowers/"

  images_per_class: 100
  images_per_class_debug: 5


# Model Configuration
models:
  gemma:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  qwen:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8004/v1"
    api_key: "skip"

  phi:
    full_name: "microsoft/Phi-3.5-vision-instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  llama:
    full_name: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    api_base: "http://localhost:8003/v1"
    api_key: "skip"


# Inference Settings
inference:
  temperature: 0.2
  max_tokens_instruction: 150
  max_tokens_inference: 150


# Experiment Settings
experiment:
  top_k_retrieval: [1, 2, 3, 5]
  max_workers: 69
  clip_model: "ViT-B-32"


# Output Paths
output:
  embeddings_path: "data/clip_embeddings_train.npy"
  test_embeddings_path: "data/clip_embeddings_test.npy"
  instruction_base_dir: "instruction/"
  image_base_dir: "image/"
  results_dir: "results/"
  figures_dir: "results/figures/"
  hybrid_dir: "hybrid/"
  hybrid_new_dir: "hybrid_new/"


# Prompts
prompts:
 
  instruction_generation: |
    You are an expert botanist and fine-grained flower recognition specialist. Your task is to generate generalizable identification rules for a flower species from the Oxford 102 Flowers dataset that can be applied to ANY image of this species — not just the example shown.

    Flower Species: {label}

    Generate exactly 3 identification rules in the following format:
    1. To identify [flower species], look for [primary visual cue — petal count, petal shape (rounded, pointed, fringed, reflexed, tubular), overall bloom form (radially symmetric, bilateral, composite, spike, umbel), and characteristic color pattern (solid, striped, spotted, gradient, bicolor center)]
    2. To distinguish from visually similar species, focus on [the most reliable fine-grained cue — stamen/pistil arrangement (prominent vs recessed, color contrast), petal texture (smooth, crinkled, waxy, velvety), leaf shape visible in frame (if present), stem characteristics, or distinctive center markings such as eye zones, veining, or nectar guides]
    3. To avoid misclassification, check [the most commonly confused species — typically those with a similar color or bloom form — and the single structural or textural feature that resolves the ambiguity]

    Rules must be:
    - General enough to apply to any image of {label}, not just this one
    - Focused on stable morphological cues (do NOT rely on background, lighting conditions, or image composition)
    - Concise — one sentence each

    Do not write paragraphs. Do not describe this specific image. Do not ask questions.

  zero_shot: |
    Identify the flower species shown in the image.
    Provide only the flower species name from the Oxford 102 Flowers dataset. Do not output anything else.

  few_shot_system: |
    You are an expert flower recognition system trained on the visual properties of diverse flower species. Study the following example images carefully.

  few_shot_example: |
    Example {idx}:
    Species: {label}

  few_shot_target: |
    Now classify the flower species in the following image.
    Provide only the flower species name from the Oxford 102 Flowers dataset. Do not output anything else.

  approach1_system: |
    You are an expert flower classifier. Below are reasoning instructions derived from Oxford 102 Flowers images that are visually similar to the target image. Go through them carefully in order to classify the target image.

  approach1_example: |
    Instruction {idx}:
    Species: {label}
    Instruction: {instruction}

  approach1_target: |
    Apply the above reasoning strategies to classify the following image into an Oxford 102 Flowers species name. Focus on stable morphological cues — petal count and shape (rounded, pointed, fringed, reflexed, tubular), bloom form (radially symmetric, bilateral, composite, spike), color pattern (solid, striped, spotted, bicolor), stamen/pistil arrangement and color contrast, and petal texture (smooth, crinkled, waxy, velvety) — and relate them to the instructions provided. Ignore background and lighting.
    Provide only the flower species name, exactly as mentioned in the instructions provided. 

  hybrid_system: |
    You are an expert in fine-grained flower classification. You will be given two types of in-context examples:
    1. Visual examples: images paired with their correct flower species name.
    2. Reasoning instructions: text-based strategies derived from visually similar Oxford 102 Flowers images, describing how to identify the flower species.
    Your goal is to correctly identify the flower species of the target image. Study all examples and instructions carefully before answering.

  hybrid_image_example: |
    Example {idx}:
    Species: {label}

  hybrid_instruction_example: |
    Instruction Example {idx}:
    Species: {label}
    Instruction: {instruction}

  hybrid_target: |
    Now predict the flower species name using both the visual examples and reasoning strategies above. Compare morphological cues — petal count/shape, bloom form, color pattern, stamen/pistil arrangement, and petal texture — across the target and the examples; ignore background and lighting. Provide only the flower species name, do not output anything else. Use the visual examples and the instructions to answer based on the target image only. Do not get confused with the example images.
    Give the exact flower species name. Do not give a generic description. 

  hybrid_new_system: |
    You are an expert in fine-grained flower classification. You will be given two types of in-context examples:
    1. Reasoning instructions: text-based strategies derived from visually similar images from the Oxford 102 Flowers dataset, describing how to identify the flower species.
    2. Visual examples: images paired with their correct flower species name.
    Your primary guidance comes from the reasoning instructions. Use the visual examples as supplementary evidence. Study all instructions and examples carefully before answering.

  hybrid_new_image_example: |
    Visual Example {idx}:
    Species: {label}

  hybrid_new_instruction_example: |
    Reasoning Instruction {idx}:
    Species: {label}
    Instruction: {instruction}

  hybrid_new_target: |
    Now predict the flower species name using the reasoning instructions and visual examples above. Do not use scientific names or the genus name. Use the general names like the ones provided in the example labels. Apply the reasoning strategies first — checking petal count/shape, bloom form, color pattern, stamen/pistil arrangement, and petal texture — then use the visual examples to confirm; ignore background and lighting. Provide only the flower species name, do not output anything else. Do not get confused with the example images.
    Give the exact flower species name. Do not give a generic description.