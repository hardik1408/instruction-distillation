# Dataset Paths
dataset:
  dtd_test_annotations_path: "data/food_test_annotations.json"
  dtd_train_annotations_path: "data/food_train_annotations.json"

  dtd_images_dir: "food/images/"

  images_per_class: 100
  images_per_class_debug: 5


# Model Configuration
models:
  gemma:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  qwen:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  phi:
    full_name: "microsoft/Phi-3.5-vision-instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  llama:
    full_name: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    api_base: "http://localhost:8003/v1"
    api_key: "skip"


# Inference Settings
inference:
  temperature: 0.2
  max_tokens_instruction: 150
  max_tokens_inference: 150


# Experiment Settings
experiment:
  top_k_retrieval: [1, 2, 3, 5]
  max_workers: 69
  clip_model: "ViT-B-32"


# Output Paths
output:
  embeddings_path: "data/clip_embeddings_train.npy"
  test_embeddings_path: "data/clip_embeddings_test.npy"
  instruction_base_dir: "instruction/"
  image_base_dir: "image/"
  results_dir: "results/"
  figures_dir: "results/figures/"
  hybrid_dir: "hybrid/"
  hybrid_new_dir: "hybrid_new/"


# Prompts
prompts:
 
  instruction_generation: |
    You are an expert in food recognition and culinary visual analysis. Your task is to generate generalizable identification rules for a food category from the Food-101 dataset that can be applied to ANY image of this dish — not just the example shown.

    Food Category: {label}

    Generate exactly 3 identification rules in the following format:
    1. To identify [food category], look for [general visual cue — shape, color, dominant ingredients, or plating style]
    2. To distinguish from similar dishes, focus on [differentiating characteristic — surface texture, garnish, sauce, layering, or cooking method cues such as browning, glaze, or char]
    3. To avoid misclassification, check [common confusion point with a visually similar dish and how to resolve it]

    Rules must be:
    - General enough to apply to any image of {label}, not just this one
    - Focused on visually observable properties (color, shape, surface texture, ingredient arrangement, portion style, cooking cues)
    - Concise — one sentence each

    Do not write paragraphs. Do not describe this specific image. Do not ask questions.

  zero_shot: |
    Identify the food dish shown in the image.
    Provide only the food category name from the Food-101 dataset. Do not output anything else.

  few_shot_system: |
    You are an expert food recognition system trained on visual properties of diverse cuisines and dishes. Study the following example images carefully.

  few_shot_example: |
    Example {idx}:
    Category: {label}

  few_shot_target: |
    Now classify the food dish in the following image.
    Provide only the food category name. Do not output anything else.

  approach1_system: |
    You are an expert food classifier. Below are reasoning instructions derived from Food-101 images that are visually similar to the target image. Go through them carefully in order to classify the target image.

  approach1_example: |
    Instruction {idx}:
    Category: {label}
    Instruction: {instruction}

  approach1_target: |
    Apply the above reasoning strategies to classify the following image into a Food-101 category name. Focus on visible dish properties — ingredient composition, color, shape, cooking method cues, and plating style — and relate them to the instructions provided.
    Provide only the food category name, similar to what is mentioned in the instructions provided. 

  hybrid_system: |
    You are an expert in fine-grained food classification. You will be given two types of in-context examples:
    1. Visual examples: images paired with their correct food category name.
    2. Reasoning instructions: text-based strategies derived from visually similar Food-101 images, describing how to identify the food category.
    Your goal is to correctly identify the food category of the target image. Study all examples and instructions carefully before answering.

  hybrid_image_example: |
    Example {idx}:
    Category: {label}

  hybrid_instruction_example: |
    Instruction Example {idx}:
    Category: {label}
    Instruction: {instruction}

  hybrid_target: |
    Now predict the food category name using both the visual examples and reasoning strategies above. Provide only the food category name, do not output anything else. Use the visual examples and the instructions to answer based on the target image only. Do not get confused with the example images.
    Give the exact food category name. Do not give a generic description. 
  hybrid_new_system: |
    You are an expert in fine-grained food classification. You will be given two types of in-context examples:
    1. Reasoning instructions: text-based strategies derived from visually similar images from the Food-101 dataset, describing how to identify the food category.
    2. Visual examples: images paired with their correct food category name.
    Your primary guidance comes from the reasoning instructions. Use the visual examples as supplementary evidence. Study all instructions and examples carefully before answering.

  hybrid_new_image_example: |
    Visual Example {idx}:
    Category: {label}

  hybrid_new_instruction_example: |
    Reasoning Instruction {idx}:
    Category: {label}
    Instruction: {instruction}

  hybrid_new_target: |
    Now predict the food category name using the reasoning instructions and visual examples above. Provide only the food category name, do not output anything else. Apply the reasoning strategies first, then use the visual examples to confirm. Do not get confused with the example images.
    Give the exact food category name. Do not give a generic description. 