# Dataset Paths
dataset:
  dtd_test_annotations_path: "data/dtd_test_annotations.json"
  dtd_train_annotations_path: "data/dtd_train_annotations.json"

  dtd_images_dir: "DTD"

  images_per_class: 100
  images_per_class_debug: 5


# Model Configuration
models:
  gemma:
    full_name: "google/gemma-3-4b-it"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  qwen:
    full_name: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_base: "http://localhost:8003/v1"
    api_key: "skip"

  phi:
    full_name: "microsoft/Phi-3.5-vision-instruct"
    api_base: "http://localhost:8000/v1"
    api_key: "skip"

  llama:
    full_name: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    api_base: "http://localhost:8003/v1"
    api_key: "skip"


# Inference Settings
inference:
  temperature: 0.2
  max_tokens_instruction: 150
  max_tokens_inference: 150


# Experiment Settings
experiment:
  top_k_retrieval: [1, 2, 3, 5]
  max_workers: 20
  clip_model: "ViT-B-32"


# Output Paths
output:
  embeddings_path: "data/clip_embeddings_train.npy"
  test_embeddings_path: "data/clip_embeddings_test.npy"
  instruction_base_dir: "instruction/"
  image_base_dir: "image/"
  results_dir: "results/"
  figures_dir: "results/figures/"
  hybrid_dir: "hybrid/"
  hybrid_new_dir: "hybrid_new/"


# Prompts
prompts:
 
  instruction_generation: |
    You are an expert in visual texture recognition and perceptual image analysis.Your task is to generate generalizable identification rules for a texture class from the Describable Textures Dataset (DTD) that can be applied to ANY image exhibiting this texture — not just the example shown.


    Look carefully at this image. It belongs to the texture class: {label}

    Step 1 — Observe: Note the specific visual properties you can see in this image: the pattern regularity, element shape, spacing, directionality, surface relief, and color variation that make it recognizably "{label}".

    Step 2 — Generalize: Using those observations, write exactly 3 rules that a viewer could use to identify ANY "{label}" texture image. Each rule must be grounded in the visual properties you observed but phrased so it applies beyond this specific image.

    Use this format exactly:
    1. To identify the {label} texture, look for [specific visual cue grounded in what you observed]
    2. To distinguish from similar textures, focus on [differentiating property that separates {label} from visually close classes]
    3. To avoid misclassification, check [concrete test — what would confirm or rule out {label}]

    Rules must be:
    - One sentence each
    - Specific enough to be actionable (mention actual perceptual properties: geometry, regularity, directionality, scale, relief, color)
    - General enough to apply to other images of {label}, not a caption of this image

    Do not write paragraphs. Do not number with anything other than 1/2/3. Do not ask questions.

  zero_shot: |
    Identify the texture class shown in the image.
    Provide only the texture class name. Do not output anything at all.

  few_shot_system: |
    You are an expert texture classifier trained on perceptual attributes of natural and man-made surfaces. Study the following examples carefully.

  few_shot_example: |
    Example {idx}:
    Class: {label}

  few_shot_target: |
    Now classify the texture in the following image.
    Provide only the texture class name. Do not output anything at all.

  approach1_system: |
    You are an expert texture classifier. Below are reasoning instructions derived from images in the Describable Textures Dataset (DTD) that are visually similar to the target image. Go through them carefully in order to classify the target image.

  approach1_example: |
    Instruction {idx}:
    Label: {label}
    Instruction: {instruction}

  approach1_target: |
    Apply the above reasoning strategies to classify the following image into a texture class name. Focus on the surface patterns, repetition, structure, and perceptual qualities visible in the image and relate them to the instructions provided.
    Provide only the texture class name, similar to what is mentioned in the instructions provided. Generally it is same as the label of the first retrieved instruction.

  hybrid_system: |
    You are an expert in fine-grained texture classification. You will be given two types of in-context examples:
    1. Visual examples: images paired with their correct texture class name.
    2. Reasoning instructions: text-based strategies derived from visually similar images, describing how to identify the texture class.
    Your goal is to correctly identify the texture class of the target image. Study all examples and instructions carefully before answering.

  hybrid_image_example: |
    Example {idx}:
    Class: {label}

  hybrid_instruction_example: |
    Instruction Example {idx}
    Label: {label}
    Instruction: {instruction}

  hybrid_target: |
    Now predict the texture class name using both the visual examples and reasoning strategies above. Provide only the texture class name, do not output anything else. Use the visual examples and the instructions to answer based on the target image only. Do not get confused with the example images.
    Give the exact texture class name. Do not give a generic description. It is same as the label of the first retrieved example.

  hybrid_new_system: |
    You are an expert in fine-grained texture classification. You will be given two types of in-context examples:
    1. Reasoning instructions: text-based strategies derived from visually similar images from the DTD dataset, describing how to identify the texture class.
    2. Visual examples: images paired with their correct texture class name.
    Your primary guidance comes from the reasoning instructions. Use the visual examples as supplementary evidence. Study all instructions and examples carefully before answering.

  hybrid_new_image_example: |
    Visual Example {idx}:
    Class: {label}

  hybrid_new_instruction_example: |
    Reasoning Instruction {idx}:
    Label: {label}
    Instruction: {instruction}

  hybrid_new_target: |
    Now predict the texture class name using the reasoning instructions and visual examples above. Provide only the texture class name, do not output anything else. Apply the reasoning strategies first, then use the visual examples to confirm. Do not get confused with the example images.
    Give the exact texture class name. Do not give a generic description. It is same as the label of the first retrieved instruction.